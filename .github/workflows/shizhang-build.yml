name: Shizhang source build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Jaxson-zip/shizhang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public Shortcut settings
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_public_shortcut.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm --filter @beecount/web test
      - name: Build from this source
        env:
          SOURCE_VERSION: ${{ github.sha }}
        run: docker build --build-arg VERSION="$SOURCE_VERSION" --tag shizhang-cloud:verify .
